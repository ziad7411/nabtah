name: nabtah
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.4.0
  firebase_dynamic_links: ^6.1.10
  flutter_bloc: ^8.1.3
  app_links: ^3.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_animate: ^4.5.0
  image_picker: ^1.0.7
  firebase_storage: ^12.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  url_launcher: ^6.3.0
  workmanager: ^0.6.0
  icons_launcher: ^3.1.0
  
 
  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/geo/regions.geojson
    - assets/plants.json
  generate: true

icons_launcher:
  image_path: "assets/images/logo1.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true